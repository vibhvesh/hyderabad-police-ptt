[platformio]
default_envs = xiao_esp32s3_inmp441_max98357a

; Select a kit with pio run -e <name>. The default is the XIAO build.
; pio run -e xiao_esp32s3_inmp441_max98357a
; pio run -e a1s_es8388
; pio run -e lyrat_v43_es8388
; pio run -e s3_korvo2_es8311

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -std=gnu++20

[env:xiao_esp32s3_inmp441_max98357a]
extends = env
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DBOARD_XIAO_INMP441

[env:a1s_es8388]
extends = env
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -DBOARD_A1S_ES8388

[env:lyrat_v43_es8388]
extends = env
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -DBOARD_LYRAT_ES8388

[env:s3_korvo2_es8311]
extends = env
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_S3_KORVO2_ES8311

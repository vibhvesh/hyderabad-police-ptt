[platformio]
default_envs = esp32-a1s

; The Boondock kit is the default. pio run -e <name> selects another board.
; pio run -e esp32-a1s
; pio run -e nodemcu-32s
; pio run -e nodemcu-esp8266
; Add -DLISTEN_ONLY to any ESP32 env to build that board as receive-only.
; pio run -e xiao_esp32s3_inmp441_max98357a
; pio run -e lyrat_v43_es8388
; pio run -e s3_korvo2_es8311

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -std=gnu++20
build_src_filter = +<*> -<esp8266/>

[env:xiao_esp32s3_inmp441_max98357a]
extends = env
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DBOARD_XIAO_INMP441

[env:esp32-a1s]
extends = env
board = esp32dev
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
upload_speed = 115200
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_ESP32_A1S

[env:nodemcu-32s]
extends = env
board = nodemcu-32s
board_build.partitions = huge_app.csv
upload_speed = 115200
build_flags =
  ${env.build_flags}
  -DBOARD_NODEMCU_32S

; ESP8266 NodeMCU v2/v3. Listen-only. It cannot run the ESP32 sources.
[env:nodemcu-esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.3.0
build_src_filter = +<esp8266/*.cpp>
build_flags =
  -DLISTEN_ONLY
  -std=gnu++17

[env:lyrat_v43_es8388]
extends = env
board = esp32dev
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -DBOARD_LYRAT_ES8388

[env:s3_korvo2_es8311]
extends = env
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_S3_KORVO2_ES8311

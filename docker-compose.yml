# Sanket PTT v2. The image is built from the multi-arch node:22-bookworm-slim base,
# so the same compose file runs on linux/amd64 and linux/arm64.
services:
  sanket:
    build:
      context: .
    image: sanket-ptt:local
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ${SANKET_DATA:-./data}:/data
    restart: unless-stopped
